paragraph=Wi-Fi provisioning with a captive setup portal, an authenticated real-time channel, OTA updates, GPIO control and structured JSON commands. Every device generates an ECDSA P-256 keypair on-chip and proves its identity before any data flows; the private key never leaves the ESP32.
